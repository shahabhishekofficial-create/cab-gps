<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><title>CAB Operations</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17191c;--muted:#737981;--line:#e8eaed;--brand:#17191c;--green:#16835b;--red:#c24141;--amber:#b7791f;--blue:#3267d6;--radius:22px;--shadow:0 8px 28px rgba(20,25,30,.06)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg)}.top{position:sticky;top:0;z-index:8;padding:15px 18px 12px;background:rgba(246,247,249,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,234,237,.75)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:#17191c;color:#fff;display:grid;place-items:center;font-size:21px}.top h1{font-size:18px;margin:0;letter-spacing:-.3px}.top small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.content{padding:15px 16px 104px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:13px;box-shadow:var(--shadow)}.hero{background:#17191c;color:#fff;border:0;box-shadow:0 12px 32px rgba(0,0,0,.13)}.hero .muted{color:#aeb4bb}.hero h2{font-size:28px;margin:5px 0 3px;letter-spacing:-.8px}.hero p{margin:0}.sessionbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.status{font-size:11px;font-weight:800;padding:7px 10px;border-radius:999px;background:#e7f7f0;color:#16835b}.status.off{background:#eef0f2;color:#737981}.sessiongrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sessionmetric{background:rgba(255,255,255,.08);border-radius:15px;padding:12px}.sessionmetric span{font-size:11px;color:#aeb4bb}.sessionmetric b{display:block;font-size:20px;margin-top:4px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0 17px}.quick button{min-height:76px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);font-weight:800;font-size:11px;color:var(--text)}.quick .ico{display:block;font-size:22px;margin-bottom:7px}.quick button:active,.nav button:active,.action:active{transform:scale(.97)}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.sectionhead h3{font-size:17px;margin:0;letter-spacing:-.3px}.sectionhead span{font-size:12px;color:var(--muted)}.metric-card{padding:16px}.metric-top{display:flex;align-items:flex-start;justify-content:space-between}.metric-name{font-size:12px;color:var(--muted);font-weight:700}.metric-value{font-size:26px;font-weight:850;letter-spacing:-.7px;margin-top:4px}.trend{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px;background:#e7f7f0;color:#16835b}.trend.down{background:#fff0f0;color:var(--red)}.trend.neutral{background:#eef0f2;color:var(--muted)}.spark{height:72px;display:flex;align-items:flex-end;gap:5px;margin-top:13px}.bar{flex:1;min-height:5px;border-radius:6px 6px 3px 3px;background:#dfe3e8;position:relative}.bar.active{background:#17191c}.bar i{position:absolute;left:50%;transform:translateX(-50%);bottom:-17px;font-style:normal;font-size:9px;color:#92979d}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.metric-grid .metric-card{margin:0}.selector{display:flex;gap:7px;overflow:auto;padding:2px 1px 4px;scrollbar-width:none}.selector::-webkit-scrollbar{display:none}.selector button{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--muted)}.selector button.sel{background:#17191c;color:#fff;border-color:#17191c}.performance{margin-top:11px}.perf-head{display:flex;justify-content:space-between;align-items:end}.perf-head b{font-size:22px}.perf-head span{font-size:11px;color:var(--muted)}.chart{height:155px;display:flex;align-items:flex-end;gap:7px;padding:15px 2px 20px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.col .v{font-size:9px;color:var(--muted);margin-bottom:5px;white-space:nowrap}.col .cbar{width:100%;max-width:30px;background:#dfe3e8;border-radius:7px 7px 3px 3px;min-height:4px}.col.today .cbar{background:#17191c}.col label{font-size:9px;color:#92979d;position:absolute;bottom:-18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary div{background:#f7f8fa;border-radius:14px;padding:11px}.summary span{display:block;font-size:10px;color:var(--muted)}.summary b{display:block;margin-top:3px;font-size:15px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.avatar{width:39px;height:39px;border-radius:13px;background:#eef0f2;display:grid;place-items:center;flex:none}.left{display:flex;align-items:center;gap:11px;min-width:0}.left strong{font-size:13px}.left small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.amount{font-weight:850;white-space:nowrap}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f7f0;color:#16835b;font-size:10px;font-weight:800}.btn{width:100%;border-radius:15px;padding:14px 16px;font-weight:800;margin-top:9px}.primary{background:#17191c;color:#fff}.success{background:#16835b;color:#fff}.danger{background:#c24141;color:#fff}.secondary{background:#eef0f2;color:#17191c}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #dfe2e6;border-radius:14px;background:#fff;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#17191c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted);font-size:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:9}.nav button{background:transparent;border-radius:13px;padding:7px 3px;color:#8a9097;font-size:10px;font-weight:800}.nav button.active{background:#eef0f2;color:#17191c}.nav .ni{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:rgba(10,12,14,.58);z-index:20;padding:14px;overflow:auto}.modalbox{max-width:530px;margin:8vh auto 30px;background:#fff;border-radius:25px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:21px}.close{width:36px;height:36px;border-radius:12px;background:#eef0f2}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#17191c;color:#fff;padding:12px 16px;border-radius:13px;z-index:30;max-width:90%;box-shadow:0 8px 25px #0004;font-size:13px;font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:100%;max-width:430px}.loginbrand{text-align:center;margin-bottom:20px}.loginbrand .logo{margin:auto;width:58px;height:58px;font-size:28px}.loginbrand h1{font-size:27px;margin:12px 0 4px;letter-spacing:-1px}.loginbrand p{color:var(--muted);margin:0;font-size:13px}@media(min-width:700px){body{padding:20px}.app{border-radius:28px;overflow:hidden;box-shadow:0 15px 50px #00000012}}
</style></head>
<body><div class="app">
<div id="login" class="login"><div class="loginbox"><div class="loginbrand"><div class="logo">🚕</div><h1>CAB Operations</h1><p>Driver operations, simplified.</p></div><div class="card"><div class="field"><label>Driver email</label><input id="loginEmail" type="email" placeholder="driver@example.com" autocomplete="email"></div><button class="btn primary" onclick="login()">Continue</button></div></div></div>
<div id="main" class="hidden"><header class="top"><div class="toprow"><div class="brand"><div class="logo">🚕</div><div><h1>CAB Operations</h1><small id="userLine"></small></div></div><span id="headStatus" class="status off">OFF</span></div></header><main class="content"><section id="home"></section><section id="trips" class="hidden"></section><section id="finance" class="hidden"></section><section id="vehicle" class="hidden"></section></main><nav class="nav"><button id="n-home" onclick="show('home')"><span class="ni">⌂</span>Home</button><button id="n-trips" onclick="show('trips')"><span class="ni">🚕</span>Trips</button><button id="n-finance" onclick="show('finance')"><span class="ni">₹</span>Money</button><button id="n-vehicle" onclick="show('vehicle')"><span class="ni">🚗</span>Vehicle</button></nav></div></div><div id="modal" class="hidden"></div><div id="toast" class="hidden toast"></div>
<script>
const KEY='cab_ops_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,vehicle:{id:'AURA-01',name:'Hyundai Aura',reg:'GJ01NT0088',fuel:'CNG',odo:0,services:[]},session:null,trips:[],fuel:[],expenses:[],exceptions:[]};let selectedMetric='Revenue';
const money=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),2200)}function login(){const email=document.getElementById('loginEmail').value.trim();if(!email)return toast('Enter driver email');db.user={id:'DRIVER-01',email};save();document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden');render()}function logout(){db.user=null;save();location.reload()}function show(id){['home','trips','finance','vehicle'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');render()}
function modal(title,body){document.getElementById('modal').innerHTML=`<div class="modalback"><div class="modalbox"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}<button class="btn secondary" onclick="closeModal()">Cancel</button></div></div>`;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function gps(cb){if(!navigator.geolocation)return cb(null);navigator.geolocation.getCurrentPosition(p=>cb({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,time:new Date().toISOString()}),()=>cb(null),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}function cameraInput(id,label='Photo'){return `<div class="field"><label>${label}</label><input id="${id}" type="file" accept="image/*" capture="environment"></div>`}
function startDay(){if(db.session?.status==='OPEN')return toast('Session already open');modal('🌅 Start Session',`<p class="muted">Capture your opening odometer and GPS position.</p><div class="field"><label>Start odometer</label><input id="sOdo" type="number" min="0"></div>${cameraInput('sPhoto','Odometer photo')}<button class="btn success" onclick="submitStart()">Start Session + GPS</button>`)}
function submitStart(){const odo=Number(document.getElementById('sOdo').value);if(!odo)return toast('Enter odometer');gps(g=>{db.session={id:'SES-'+Date.now(),driverId:db.user.id,vehicleId:db.vehicle.id,startAt:new Date().toISOString(),startOdo:odo,startGps:g,status:'OPEN',closeAt:null,closeOdo:null,closeGps:null};db.vehicle.odo=odo;save();closeModal();toast('✓ Session started')})}
function closeDay(){if(!db.session||db.session.status!=='OPEN')return toast('No open session');modal('🌙 Close Session',`<p class="muted">Closing works across midnight — the session stays linked to its start.</p><div class="field"><label>Close odometer</label><input id="cOdo" type="number" min="0" value="${db.vehicle.odo||''}"></div>${cameraInput('cPhoto','Closing odometer photo')}<div class="grid"><div class="field"><label>Reported trips</label><input id="rTrips" type="number" min="0" value="${completedTrips()}"></div><div class="field"><label>Reported income ₹</label><input id="rIncome" type="number" min="0" value="${revenue()}"></div></div><button class="btn success" onclick="submitClose()">Close Session + GPS</button>`)}
function submitClose(){const odo=Number(document.getElementById('cOdo').value);if(!odo)return toast('Enter odometer');if(odo<db.session.startOdo)return toast('Close odometer cannot be lower');gps(g=>{db.session.closeAt=new Date().toISOString();db.session.closeOdo=odo;db.session.closeGps=g;db.session.status='CLOSED';db.vehicle.odo=odo;save();closeModal();toast('✓ Session closed')})}
function addTrip(){if(!db.session||db.session.status!=='OPEN')return toast('Start session first');modal('🚕 Add Trip',`<div class="field"><label>Platform</label><select id="tPlatform"><option>Uber</option><option>Ola</option><option>Rapido</option><option>Other</option></select></div><div class="grid"><div class="field"><label>Pickup</label><input id="tPick"></div><div class="field"><label>Drop</label><input id="tDrop"></div></div><div class="grid"><div class="field"><label>Start odometer</label><input id="tStart" type="number" value="${db.vehicle.odo}"></div><div class="field"><label>End odometer</label><input id="tEnd" type="number"></div></div><div class="grid"><div class="field"><label>Gross fare ₹</label><input id="tFare" type="number"></div><div class="field"><label>Trip expense ₹</label><input id="tCharge" type="number" value="0"></div></div><div class="grid"><div class="field"><label>Payment</label><select id="tPay"><option>Cash</option><option>UPI</option><option>Aggregator</option><option>Other</option></select></div><div class="field"><label>Status</label><select id="tStatus"><option>Completed</option><option>Cancelled by Customer</option><option>Cancelled by Driver</option><option>Customer No-Show</option></select></div></div><button class="btn primary" onclick="submitTrip()">Save Trip</button>`)}
function submitTrip(){const s=Number(document.getElementById('tStart').value),e=Number(document.getElementById('tEnd').value),fare=Number(document.getElementById('tFare').value||0),charge=Number(document.getElementById('tCharge').value||0);if(e<s)return toast('End odometer must be ≥ start');const status=document.getElementById('tStatus').value;db.trips.push({id:crypto.randomUUID?crypto.randomUUID():'TRP-'+Date.now(),sessionId:db.session.id,at:new Date().toISOString(),platform:document.getElementById('tPlatform').value,pickup:document.getElementById('tPick').value,drop:document.getElementById('tDrop').value,startOdo:s,endOdo:e,km:e-s,grossFare:fare,tripExpense:charge,payment:document.getElementById('tPay').value,status});db.vehicle.odo=e;save();closeModal();toast('✓ Trip saved')}
function addFuel(){if(!db.session||db.session.status!=='OPEN')return toast('Start session first');modal('⛽ Add Fuel',`<div class="grid"><div class="field"><label>Odometer</label><input id="fOdo" type="number" value="${db.vehicle.odo}"></div><div class="field"><label>Quantity</label><input id="fQty" type="number" step="0.01"></div></div><div class="grid"><div class="field"><label>Rate ₹</label><input id="fRate" type="number" step="0.01"></div><div class="field"><label>Amount ₹</label><input id="fAmt" type="number" step="0.01"></div></div><div class="field"><label>Fuel type</label><select id="fType"><option>CNG</option><option>Petrol</option><option>Diesel</option><option>EV Charging</option></select></div>${cameraInput('fPhoto','Fuel receipt photo')}<button class="btn primary" onclick="submitFuel()">Save Fuel</button>`)}
function submitFuel(){const odo=Number(document.getElementById('fOdo').value),qty=Number(document.getElementById('fQty').value),rate=Number(document.getElementById('fRate').value),amt=Number(document.getElementById('fAmt').value||qty*rate);if(odo<db.vehicle.odo)return toast('Odometer cannot go backwards');db.fuel.push({id:crypto.randomUUID?crypto.randomUUID():'F-'+Date.now(),sessionId:db.session.id,at:new Date().toISOString(),type:document.getElementById('fType').value,odo,qty,rate,amount:amt});db.vehicle.odo=odo;save();closeModal();toast('✓ Fuel saved')}
function addExpense(){if(!db.session||db.session.status!=='OPEN')return toast('Start session first');modal('💰 Add Expense',`<div class="field"><label>Category</label><select id="eCat"><option>Toll</option><option>Parking</option><option>Car Wash</option><option>Repair</option><option>Maintenance</option><option>Fine</option><option>Other</option></select></div><div class="field"><label>Amount ₹</label><input id="eAmt" type="number"></div>${cameraInput('ePhoto','Proof photo')}<div class="field"><label>Notes</label><textarea id="eNote" rows="3"></textarea></div><button class="btn primary" onclick="submitExpense()">Save Expense</button>`)}
function submitExpense(){const a=Number(document.getElementById('eAmt').value);if(a<=0)return toast('Enter amount');db.expenses.push({id:crypto.randomUUID?crypto.randomUUID():'E-'+Date.now(),sessionId:db.session.id,at:new Date().toISOString(),category:document.getElementById('eCat').value,amount:a,note:document.getElementById('eNote').value});save();closeModal();toast('✓ Expense saved')}
function addService(){modal('🔧 Vehicle Service',`<div class="field"><label>Service type</label><input id="svType" placeholder="Periodic Service"></div><div class="grid"><div class="field"><label>Date</label><input id="svDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Odometer</label><input id="svOdo" type="number" value="${db.vehicle.odo}"></div></div><div class="field"><label>Amount ₹</label><input id="svAmt" type="number"></div><div class="field"><label>Next service odometer</label><input id="svNext" type="number"></div><button class="btn primary" onclick="submitService()">Save Service</button>`)}function submitService(){db.vehicle.services.push({type:document.getElementById('svType').value||'Service',date:document.getElementById('svDate').value,odo:Number(document.getElementById('svOdo').value),amount:Number(document.getElementById('svAmt').value||0),nextOdo:Number(document.getElementById('svNext').value||0)});save();closeModal();toast('✓ Service saved')}
function completedTrips(){return db.trips.filter(t=>t.sessionId===db.session?.id&&t.status==='Completed').length}function revenue(){return db.trips.filter(t=>t.sessionId===db.session?.id).reduce((a,t)=>a+t.grossFare,0)}function sessionKm(){return db.session?.closeOdo!=null?db.session.closeOdo-db.session.startOdo:db.vehicle.odo-(db.session?.startOdo||db.vehicle.odo)}
function dayKey(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}function last7(){const out=[];const now=new Date();for(let i=6;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push({key:dayKey(d),label:d.toLocaleDateString('en-IN',{weekday:'short'}),date:d})}return out}
function metrics7(){return last7().map(d=>{const ts=db.trips.filter(x=>dayKey(x.at)===d.key);const fu=db.fuel.filter(x=>dayKey(x.at)===d.key);const ex=db.expenses.filter(x=>dayKey(x.at)===d.key);return {...d,trips:ts.filter(x=>x.status==='Completed').length,revenue:ts.reduce((a,x)=>a+x.grossFare,0),km:ts.reduce((a,x)=>a+x.km,0),fuel:fu.reduce((a,x)=>a+x.amount,0),expenses:ex.reduce((a,x)=>a+x.amount,0),net:ts.reduce((a,x)=>a+x.grossFare-x.tripExpense,0)-fu.reduce((a,x)=>a+x.amount,0)-ex.reduce((a,x)=>a+x.amount,0)}})}
function metricValue(d){return d[selectedMetric.toLowerCase()]||0}function fmtMetric(v){return selectedMetric==='Revenue'||selectedMetric==='Fuel'||selectedMetric==='Expenses'||selectedMetric==='Net'?money(v):selectedMetric==='KM'?Math.round(v)+' km':Math.round(v)+' trips'}function selectMetric(m){selectedMetric=m;render()}
function performance(){const ds=metrics7(),vals=ds.map(metricValue),max=Math.max(...vals,1),total=vals.reduce((a,b)=>a+b,0),today=vals[6],first=vals[0],change=first?((today-first)/Math.max(Math.abs(first),1))*100:0;return `<div class="sectionhead"><h3>7-day performance</h3><span>Daily view</span></div><div class="selector">${['Revenue','Trips','KM','Fuel','Expenses','Net'].map(m=>`<button class="${selectedMetric===m?'sel':''}" onclick="selectMetric('${m}')">${m}</button>`).join('')}</div><div class="card performance"><div class="perf-head"><div><span>${selectedMetric} • last 7 days</span><br><b>${fmtMetric(total)}</b></div><span class="${change>0?'':'muted'}">Today ${fmtMetric(metricValue(today))}</span></div><div class="chart">${ds.map((d,i)=>`<div class="col ${i===6?'today':''}"><span class="v">${fmtMetric(metricValue(d))}</span><div class="cbar" style="height:${Math.max(4,(metricValue(d)/max)*105)}px"></div><label>${d.label}</label></div>`).join('')}</div><div class="summary"><div><span>7-day avg</span><b>${fmtMetric(total/7)}</b></div><div><span>Best day</span><b>${ds[vals.indexOf(max)].label}</b></div><div><span>Today vs first</span><b>${change>0?'+':''}${Math.round(change)}%</b></div></div></div>`}
function render(){if(!db.user)return;document.getElementById('userLine').textContent=`${db.user.email} • ${db.vehicle.name} ${db.vehicle.reg}`;const open=db.session?.status==='OPEN';const hs=document.getElementById('headStatus');hs.textContent=open?'● ON DUTY':'OFF';hs.className='status '+(open?'':'off');const allRev=db.trips.reduce((a,t)=>a+t.grossFare,0),allFuel=db.fuel.reduce((a,x)=>a+x.amount,0),allEx=db.expenses.reduce((a,x)=>a+x.amount,0);document.getElementById('home').innerHTML=`<div class="card hero"><div class="sessionbar"><div><div class="muted">CURRENT SESSION</div><h2>${open?'On duty':'Ready to start'}</h2><p>${open?'Started '+new Date(db.session.startAt).toLocaleString('en-IN'):'Start a new session when you begin driving.'}</p></div><span class="status ${open?'':'off'}">${open?'OPEN':'NOT STARTED'}</span></div>${open?`<div class="sessiongrid"><div class="sessionmetric"><span>Running KM</span><b>${sessionKm()}</b></div><div class="sessionmetric"><span>Trips</span><b>${completedTrips()}</b></div><div class="sessionmetric"><span>Revenue</span><b>${money(revenue())}</b></div><div class="sessionmetric"><span>Odometer</span><b>${db.vehicle.odo}</b></div></div>`:''}</div><div class="quick">${open?`<button onclick="addTrip()"><span class="ico">🚕</span>Trip</button><button onclick="addFuel()"><span class="ico">⛽</span>Fuel</button><button onclick="addExpense()"><span class="ico">💰</span>Expense</button><button onclick="closeDay()"><span class="ico">🌙</span>Close</button>`:`<button style="grid-column:1/-1" onclick="startDay()"><span class="ico">🌅</span>Start Session</button>`}</div>${performance()}<div class="sectionhead"><h3>All-time snapshot</h3><span>On this device</span></div><div class="metric-grid"><div class="card metric-card"><div class="metric-name">Trips</div><div class="metric-value">${db.trips.length}</div></div><div class="card metric-card"><div class="metric-name">Revenue</div><div class="metric-value">${money(allRev)}</div></div><div class="card metric-card"><div class="metric-name">Fuel</div><div class="metric-value">${money(allFuel)}</div></div><div class="card metric-card"><div class="metric-name">Expenses</div><div class="metric-value">${money(allEx)}</div></div></div><div class="card"><div class="sectionhead" style="margin:0 0 8px"><h3>Account</h3></div><div class="listrow"><div class="left"><div class="avatar">👤</div><div><strong>${db.user.id}</strong><small>${db.user.email}</small></div></div><button class="btn secondary" style="width:auto;margin:0;padding:9px 12px" onclick="logout()">Log out</button></div></div>`;
document.getElementById('trips').innerHTML=`<div class="sectionhead"><h3>Trips</h3><span>${db.trips.length} total</span></div><button class="btn primary" onclick="addTrip()">+ Add Trip</button><div class="card" style="margin-top:13px">${db.trips.slice().reverse().map(t=>`<div class="listrow"><div class="left"><div class="avatar">🚕</div><div><strong>${t.platform} · ${t.km} km</strong><small>${t.pickup||'—'} → ${t.drop||'—'}</small><small>${new Date(t.at).toLocaleDateString('en-IN')} · ${t.status}</small></div></div><div class="amount">${money(t.grossFare)}</div></div>`).join('')||'<p class="muted">No trips yet.</p>'}</div>`;
document.getElementById('finance').innerHTML=`<div class="sectionhead"><h3>Money</h3><span>Fuel & expenses</span></div><div class="metric-grid"><div class="card metric-card"><div class="metric-name">Fuel</div><div class="metric-value">${money(allFuel)}</div></div><div class="card metric-card"><div class="metric-name">Expenses</div><div class="metric-value">${money(allEx)}</div></div></div><button class="btn primary" onclick="addFuel()">+ Add Fuel</button><button class="btn secondary" onclick="addExpense()">+ Add Expense</button><div class="card" style="margin-top:13px"><div class="sectionhead" style="margin:0 0 3px"><h3>Recent activity</h3></div>${db.fuel.slice().reverse().slice(0,5).map(x=>`<div class="listrow"><div class="left"><div class="avatar">⛽</div><div><strong>${x.type}</strong><small>${x.qty||0} units · Odo ${x.odo}</small></div></div><div class="amount">${money(x.amount)}</div></div>`).join('')}${db.expenses.slice().reverse().slice(0,5).map(x=>`<div class="listrow"><div class="left"><div class="avatar">💰</div><div><strong>${x.category}</strong><small>${x.note||'Expense'}</small></div></div><div class="amount">${money(x.amount)}</div></div>`).join('')||'<p class="muted">No financial records yet.</p>'}</div>`;
document.getElementById('vehicle').innerHTML=`<div class="card hero"><div class="muted">ASSIGNED VEHICLE</div><h2>🚗 ${db.vehicle.name}</h2><p>${db.vehicle.reg} · ${db.vehicle.fuel}</p><div class="sessiongrid" style="margin-top:18px"><div class="sessionmetric"><span>Current Odometer</span><b>${db.vehicle.odo}</b></div><div class="sessionmetric"><span>Vehicle ID</span><b style="font-size:15px">${db.vehicle.id}</b></div></div></div><button class="btn primary" onclick="addService()">+ Add Service Record</button><div class="sectionhead"><h3>Service history</h3></div><div class="card">${db.vehicle.services.slice().reverse().map(s=>`<div class="listrow"><div class="left"><div class="avatar">🔧</div><div><strong>${s.type}</strong><small>${s.date} · Odo ${s.odo}</small></div></div><div class="amount">${money(s.amount)}</div></div>`).join('')||'<p class="muted">No service records.</p>'}</div>`;if(!document.querySelector('.nav button.active'))document.getElementById('n-home').classList.add('active')}
if(db.user){document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden')}render();
</script></body></html>
