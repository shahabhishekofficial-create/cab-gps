<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAB Location</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 20px;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    #status {
      margin-top: 25px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h2>📍 CAB Location</h2>

  <p>
    Tap the button below to record your current location.
  </p>

  <button onclick="captureLocation()">
    📍 Capture Current Location
  </button>

  <div id="status"></div>

  <script>

    function captureLocation() {

      const status = document.getElementById('status');

      status.innerHTML =
        '📍 Getting your current location...';

      if (!navigator.geolocation) {
        status.innerHTML =
          '❌ Location is not supported on this device.';
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;

          status.innerHTML =
            '✅ Location captured.<br><br>' +
            'Latitude: ' + latitude + '<br>' +
            'Longitude: ' + longitude + '<br>' +
            'Accuracy: ' + Math.round(accuracy) + ' m';

        },

        function(error) {

          let message =
            'Unable to get your location.';

          if (error.code === 1) {
            message =
              'Location permission was denied. Please allow location access.';
          }

          if (error.code === 2) {
            message =
              'Location is currently unavailable. Please check GPS/location services.';
          }

          if (error.code === 3) {
            message =
              'Location request timed out. Please try again.';
          }

          status.innerHTML =
            '❌ ' + message;
        },

        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );
    }

  </script>

</body>
</html>
