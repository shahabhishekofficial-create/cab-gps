<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAB Location</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 20px;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    #backButton {
      display: none;
      background: #555;
    }

    #status {
      margin-top: 25px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h2>📍 CAB Location</h2>

  <p>
    Tap the button below to record your current location.
  </p>

  <button id="captureButton" onclick="captureLocation()">
    📍 Capture Current Location
  </button>

  <button id="backButton" onclick="goBackToForm()">
    ↩️ Go Back to Form
  </button>

  <div id="status"></div>

<script>

const RECEIVER_URL =
'https://script.google.com/macros/s/AKfycbyhw2SQWK9a3hTtEUhbVJZhKp5CNCpPwHDqq8muUMExTJe3pKBpPxXe-0ANIg1JnY3ang/exec';


function captureLocation() {

  const status = document.getElementById('status');
  const captureButton = document.getElementById('captureButton');
  const backButton = document.getElementById('backButton');

  status.innerHTML =
    '📍 Getting your current location...';

  captureButton.disabled = true;

  if (!navigator.geolocation) {

    status.innerHTML =
      '❌ Location is not supported on this device.';

    captureButton.disabled = false;

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      const activity =
        new URLSearchParams(window.location.search)
        .get('activity') || 'Unknown';

      const data = {

        activity: activity,

        latitude: latitude,

        longitude: longitude,

        accuracy: accuracy,

        gpsTimestamp:
          new Date().toISOString()
      };


      status.innerHTML =
        '⏳ Saving location...';


      fetch(RECEIVER_URL, {

        method: 'POST',

        mode: 'no-cors',

        headers: {
          'Content-Type': 'text/plain'
        },

        body: JSON.stringify(data)

      })
      .then(function() {

        status.innerHTML =
          '✅ Location recorded successfully.' +
          '<br><br>' +
          'Accuracy: ' +
          Math.round(accuracy) +
          ' metres' +
          '<br><br>' +
          'You can now return to the CAB Form.';

        captureButton.style.display = 'none';

        backButton.style.display = 'block';

      })
      .catch(function(error) {

        status.innerHTML =
          '❌ Could not save location.' +
          '<br><br>' +
          error;

        captureButton.disabled = false;

      });

    },

    function(error) {

      let message =
        'Unable to get your location.';

      if (error.code === 1) {

        message =
          'Location permission was denied. Please allow location access.';

      } else if (error.code === 2) {

        message =
          'Location is currently unavailable.';

      } else if (error.code === 3) {

        message =
          'Location request timed out. Please try again.';

      }

      status.innerHTML =
        '❌ ' + message;

      captureButton.disabled = false;

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
}


function goBackToForm() {

  window.history.back();

}

</script>

</body>
</html>
